name: catalogo_legum_pro
description: "Catálogo LegumPro local con administración."
publish_to: 'none'
version: 0.7.1+13

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  sqflite: ^2.4.2
  path: ^1.9.1
  path_provider: ^2.1.5
  image_picker: ^1.2.0
  flutter_secure_storage: ^10.0.0
  cryptography: ^2.7.0
  diacritic: ^0.1.6
  intl: ^0.20.2
  url_launcher: ^6.3.2
  archive: ^4.0.7
  file_picker: ^10.3.0
  share_plus: ^12.0.0
  synchronized: ^3.4.0
  pdf: ^3.13.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.3.6
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/branding/legumpro-logo.jpg
    - assets/branding/legumpro-icon.png
    - assets/fonts/NotoSans-Regular.ttf
    - assets/fonts/NotoSans-Bold.ttf
